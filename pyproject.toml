[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insighta-sbi-tool"
version = "0.1.3"
description = "SBI Securities parser plugin for Insighta CLI"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
authors = [{ name = "insighta cloud Inc.", email = "tech@insighta.cloud" }]
keywords = ["insighta", "sbi", "securities", "portfolio", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "insighta-cli>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[project.entry-points."insighta_cli.plugins"]
sbi = "insighta_sbi:register"

[project.entry-points."insighta_cli.deposit_loader"]
sbi = "insighta_sbi.parser_v2:load_deposits_for_prepare"

[project.urls]
Homepage = "https://insighta.cloud"
Repository = "https://github.com/insighta-cloud/insighta-sbi-tool"
Issues = "https://github.com/insighta-cloud/insighta-sbi-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["insighta_sbi"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/", "workspaces/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: marks tests as live API tests (deselect with 'pytest -m \"not live\"')"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
